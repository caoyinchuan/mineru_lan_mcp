[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mineru_lan_mcp"
description = "使用部署在局域网内的mineru-api，来解析PDF文件，将其转换为Markdown格式"
version = "1.0.0"
authors = [
  { name = "iFlow CLI" },
]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastmcp>=2.14.1",
  "requests>=2.32.5",
  "python-dotenv>=1.2.1",
]